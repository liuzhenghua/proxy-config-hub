# OpenClash whitelist with five manual candidates and an automatic last resort.
# Replaces subscription groups. Choose nodes in Select-1 through Select-5.

[YAML]

sniffer:
  enable: false

# Avoid keeping a proxy alive when the second unified-delay probe times out.
unified-delay: false

profile:
  store-selected: true

proxy-groups!:
  - name: Select-1
    type: select
    include-all: true
  - name: Select-2
    type: select
    include-all: true
  - name: Select-3
    type: select
    include-all: true
  - name: Select-4
    type: select
    include-all: true
  - name: Select-5
    type: select
    include-all: true
  - name: Auto
    type: url-test
    include-all: true
    exclude-filter: "剩余流量|剩余[：:]|流量[：:]|套餐|到期|过期|有效期|重置|更新时间|官网|官方网站|订阅地址|(^|[^0-9.])([4-9]|10)倍率|(?i:traffic|expire|expiry|expiration|reset|remaining|official website)"
    url: https://www.gstatic.com/generate_204
    interval: 43200
    timeout: 2000
    lazy: false
    expected-status: 204
    tolerance: 300
    max-failed-times: 1
  - name: PROXY
    type: fallback
    proxies:
      - Select-1
      - Select-2
      - Select-3
      - Select-4
      - Select-5
      - Auto
    url: https://www.gstatic.com/generate_204
    interval: 600
    timeout: 2000
    lazy: false
    expected-status: 204
    max-failed-times: 1

dns:
  enable: true
  # DoH 域名自身的 bootstrap DNS
  default-nameserver!:
    - 223.5.5.5
    - 223.6.6.6
  # 默认解析：阿里公共 DNS（UDP）
  nameserver!:
    - 223.5.5.5
    - 223.6.6.6
  # 代理节点域名也使用阿里公共 DNS（UDP）
  proxy-server-nameserver!:
    - 223.5.5.5
    - 223.6.6.6
  # 按域名指定境外 DNS，避免改变其他域名的默认解析
  nameserver-policy!:
    "+.google.com":
      - "https://1.1.1.1/dns-query#PROXY"
      - "https://8.8.8.8/dns-query#PROXY"
  # 普通域名先查默认上游，地址查询失败或没有 IP 时再经代理查询
  fallback!:
    - "https://8.8.8.8/dns-query#PROXY"
    - "https://1.1.1.1/dns-query#PROXY"
  fallback-lazy-query: true
  fallback-filter!:
    geoip: false
  cache-algorithm: arc

rules!:
  # GitHub SSH bypasses the proxy; HTTPS keeps its existing policy.
  - AND,((DOMAIN,github.com),(DST-PORT,22)),DIRECT
  # Local networks and company VPN domains stay direct.
  - DOMAIN,captive.apple.com,DIRECT
  - DOMAIN-KEYWORD,qihoo,DIRECT
  - DOMAIN-KEYWORD,360,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  # IP address lookup
  - DOMAIN-SUFFIX,ipify.org,PROXY

  # Google common IPv4 ranges
  - IP-CIDR,64.233.160.0/19,PROXY,no-resolve
  - IP-CIDR,66.102.0.0/20,PROXY,no-resolve
