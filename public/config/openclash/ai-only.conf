[YAML]

dns:
  enable: true
  nameserver!:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

rules!:
  # LAN
  - DOMAIN,captive.apple.com,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  # OpenAI / ChatGPT
  - DOMAIN-KEYWORD,openai,🔰节点选择
  - DOMAIN-KEYWORD,chatgpt,🔰节点选择
  - DOMAIN-SUFFIX,oaistatic.com,🔰节点选择
  - DOMAIN-SUFFIX,oaiusercontent.com,🔰节点选择
  - DOMAIN-SUFFIX,oaistatsig.com,🔰节点选择
  - DOMAIN-SUFFIX,openaimerge.com,🔰节点选择

  # OpenAI dependencies
  - DOMAIN-SUFFIX,workos.com,🔰节点选择
  - DOMAIN-SUFFIX,workoscdn.com,🔰节点选择
  - DOMAIN-SUFFIX,workos.imgix.net,🔰节点选择
  - DOMAIN,challenges.cloudflare.com,🔰节点选择
  - DOMAIN,js.stripe.com,🔰节点选择

  - DOMAIN-SUFFIX,intercom.io,🔰节点选择
  - DOMAIN-SUFFIX,intercomcdn.com,🔰节点选择
  - DOMAIN-SUFFIX,ct.sendgrid.net,🔰节点选择

  - DOMAIN,o207216.ingest.sentry.io,🔰节点选择
  - DOMAIN,o33249.ingest.sentry.io,🔰节点选择
  - DOMAIN,rum.browser-intake-datadoghq.com,🔰节点选择

  # Claude / Anthropic
  - DOMAIN-KEYWORD,claude,🔰节点选择
  - DOMAIN-KEYWORD,anthropic,🔰节点选择

  # Everything else direct
  - MATCH,DIRECT
